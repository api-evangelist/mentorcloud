    title: MentorCloud V3.0 Release Notes
    breaking: false
    highlights:
      - Upgraded, cleaner and more intuitive user experience.
      - New home page/dashboard with guidance cards, notifications and recommended mentors/mentees.
      - Consistent module names standardized to Home, Mentorship, Sessions, Circles, Learn and Community.
      - Enhanced in-app notifications (bell icon) for session invitations, mentorship requests and major events.
      - Consolidated messaging infrastructure across the platform; the previous standalone messaging module was deprecated and existing threads migrated.
